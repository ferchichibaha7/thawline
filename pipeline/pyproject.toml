[project]
name = "thawline-pipeline"
version = "0.1.0"
description = "Data pipeline for Thawline: ingest, derive, model, export."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "httpx",
  "pandas",
  "numpy",
  "statsmodels",
  "scipy",
  "pydantic",
  "psycopg[binary]",
  "tenacity",
  "pyyaml",
]

[project.optional-dependencies]
# Later phases. Installed with `uv sync --extra later` when those phases start.
later = ["pyarrow", "openpyxl", "anthropic", "feedparser"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
